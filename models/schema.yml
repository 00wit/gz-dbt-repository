version: 2
sources:
  - name: raw
    schema: gz_raw_data
    description: Raw Dataset Contains Raw Tables For Greenweez
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: Sales Data
        columns:
          - name: orders_id
            description: primary key for the order
            tests:
              - not_null
        tests:
          - unique:
              column_name: "orders_id || '-' || pdt_id"
      - name: product
        identifier: raw_gz_product
        description: Product Data
        columns:
          - name: products_id
            description: Primary Key for Products Table
            tests:
              - not_null

      - name: shipment
        identifier: raw_gz_ship
        description: Shipment Data
        columns:
          - name: orders_id
            description: Primary Key for Shipment Table
            tests:
              - not_null

      - name: adwords
        identifier: raw_gz_adwords
        description: Adwords Data

      - name: bing
        identifier: raw_gz_bing
        description: Bing Data

      - name: criteo
        identifier: raw_gz_criteo
        description: Criteo Data

      - name: facebook
        identifier: raw_gz_facebook
        description: Facebook Data

models:
- name: int_campaigns
  description: 'Merging Ad Platform Datas'
  columns:
    - name: date_date
      description: 'Date of the Ad Data & Primary Key'
      tests:
        - not_null
    - name: paid_source
      description: 'Source'
      tests:
        - not_null
    - name: campaign_key
      description: 'Campaign ID'
      tests:
        - not_null
              
    - name: campaign_name
      description: 'Campaign Name'
      tests:
        - not_null
              
    - name: ads_cost
      description: 'Cost of the ad'
      tests:
        - not_null
              
    - name: impression
      description: 'Number of impressions'
      tests:
        - not_null
              
    - name: click
      description: 'Number of clicks'
      tests:
        - not_null
- name: int_campaigns_daily
  description: 'Merging Ad Platform Datas'
  columns:
    - name: date_date
      description: 'Date of the Ad Data & Primary Key'
      tests:
        - not_null
    - name: total_ads_cost
      description: 'Total Cost of Ads'
      tests:
        - not_null
    - name: total_ads_impression
      description: 'Total Impressions'
      tests:
        - not_null
              
    - name: total_ads_clicks
      description: 'Total Clicks'
      tests:
        - not_null    